    DashboardSummary:
      type: object
      properties:
        totalTroops:
          type: integer
        deploymentCapacity:
          type: integer
        deploymentWithCyrille:
          type: integer
        rallyCapacity:
          type: integer
        totalItems:
          type: integer
        totalGoals:
          type: integer
        completedGoals:
          type: integer
        overallGoalProgress:
          type: number
        marchesConfigured:
          type: integer
      required:
        - totalTroops
        - deploymentCapacity
        - deploymentWithCyrille
        - rallyCapacity
        - totalItems
        - totalGoals
        - completedGoals
        - overallGoalProgress
        - marchesConfigured

    LeaderboardScope:
      type: object
      properties:
        type:
          type: string
          enum: [global, state]
        stateId:
          type: ["integer", "null"]
      required:
        - type
        - stateId

    LeaderboardPlayer:
      type: object
      properties:
        rank:
          type: integer
        playerId:
          type: string
        playerName:
          type: string
        stateId:
          type: ["integer", "null"]
        power:
          type: number
        furnaceLevel:
          type: integer
        deltaPercent:
          type: ["number", "null"]
      required:
        - rank
        - playerId
        - playerName
        - stateId
        - power
        - furnaceLevel
        - deltaPercent

    LeaderboardResponse:
      type: object
      properties:
        scope:
          $ref: "#/components/schemas/LeaderboardScope"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardPlayer"
        fetchedAt:
          type: string
        isStale:
          type: boolean
          description: >
            True when the server is serving a cached snapshot older than the
            normal TTL because the upstream source is currently rate-limiting
            requests. The data is valid but may be more than 60 seconds old.
      required:
        - scope
        - rows
        - fetchedAt

    LeaderboardError:
      type: object
